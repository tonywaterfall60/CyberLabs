log_format cyberlabs_json escape=json
  '{"ts":"$time_iso8601",'
  '"remote":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"request_id":"$upstream_http_x_request_id",'
  '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    access_log /logs/edge-access.jsonl cyberlabs_json;

    add_header X-CyberLabs-Level "extra-practice" always;
    add_header X-CyberLabs-Lab "purple-team-mini-range" always;
    add_header X-CyberLabs-Edge "nginx" always;

    location /api/ {
        proxy_pass http://api:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://portal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}