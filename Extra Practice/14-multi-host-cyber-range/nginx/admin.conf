server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-CyberLabs-Lab "multi-host-range" always;
  add_header X-CyberLabs-Service "internal-admin" always;
  add_header X-Environment "training-internal" always;
  location / { try_files $uri $uri/ =404; }
}