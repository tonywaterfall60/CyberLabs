server {
    listen 80;
    server_name _;

    add_header X-CyberLabs-Level "extra-practice" always;
    add_header X-CyberLabs-Lab "web-application-mapping" always;
    add_header X-CyberLabs-Edge "nginx-proxy" always;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
