title: Office Parent Launches Encoded PowerShell
status: experimental
logsource:
  category: process_creation
  product: windows
detection:
  powershell:
    Image|endswith: '\\powershell.exe'
  office_parent:
    ParentImage|endswith:
      - '\\winword.exe'
      - '\\excel.exe'
      - '\\powerpnt.exe'
      - '\\outlook.exe'
  encoded:
    CommandLine|contains:
      - 'EncodedCommand'
      - ' -enc '
  condition: powershell and office_parent and encoded
falsepositives:
  - Legitimate Office-triggered automation
level: medium
